<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trang Trại - Sơ đồ Khu → Dãy → Ô</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#1e293b;font-family:Segoe UI,Arial,sans-serif}
header{background:#fff;padding:18px 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:24px}.sub{color:#64748b;margin-top:5px;font-size:14px}
.container{max-width:1500px;margin:auto;padding:20px}.toolbar,.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px #00000012}
.toolbar{padding:14px 18px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:9px 14px;cursor:pointer;font-weight:600}
.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0;color:#334155}.danger{background:#fee2e2;color:#b91c1c}
.layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(300px,1fr);gap:18px}.card{padding:18px}
.card h2{margin:0 0 14px;font-size:17px;border-bottom:1px solid #e2e8f0;padding-bottom:10px}
.canvas{position:relative;min-height:650px;background:#f8fafc;border:2px dashed #cbd5e1;border-radius:8px;overflow:auto;padding:10px}
.area-label{font-size:15px;font-weight:700;margin-bottom:8px;color:#475569}
.row-box{position:absolute;background:#fff;border:2px solid #94a3b8;border-radius:8px;padding:8px;box-shadow:0 2px 6px #00000012}
.row-box.inactive{opacity:.5}.row-title{font-size:12px;font-weight:700;margin-bottom:7px;color:#334155}
.cages{display:grid;grid-template-columns:repeat(4,minmax(42px,1fr));gap:4px}
.cage{border:1px solid #38bdf8;background:#e0f2fe;color:#0369a1;border-radius:4px;padding:6px 3px;text-align:center;font-size:11px;font-weight:700;cursor:pointer}
.cage:hover{background:#0284c7;color:#fff}.cage.inactive{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border:1px solid #e2e8f0;text-align:left}th{background:#f8fafc}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}.active{background:#dcfce7;color:#15803d}.inactive{background:#fee2e2;color:#b91c1c}
.crumb{font-weight:700;color:#2563eb;margin-bottom:12px;line-height:1.5}.muted{color:#64748b}.empty{padding:30px;text-align:center;color:#94a3b8}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}
.dialog{background:#fff;border-radius:10px;width:min(520px,92vw);padding:20px}.dialog h3{margin-top:0}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.canvas{min-height:550px}}
</style>
</head>
<body>
<header>
<h1>QUẢN LÝ SƠ ĐỒ TRANG TRẠI</h1>
<div class="sub">TRANG TRẠI → KHU → DÃY → Ô · Bản 1 file HTML · Lưu dữ liệu trên trình duyệt</div>
</header>
<div class="container">
<div class="toolbar">
<button class="primary" onclick="openRowModal()">+ Thêm Dãy</button>
<button class="primary" onclick="openCageModal()">+ Thêm Ô</button>
<button class="secondary" onclick="resetDemo()">Khôi phục dữ liệu mẫu</button>
<button class="danger" onclick="clearAll()">Xóa dữ liệu trên máy</button>
<span class="muted" id="saveState"></span>
</div>
<div class="layout">
<section class="card">
<h2 id="areaTitle">Khu Sinh Sản</h2>
<div id="canvas" class="canvas"></div>
</section>
<section class="card">
<h2>Thông tin</h2>
<div id="inspector" class="empty">Chọn một Ô trên sơ đồ.</div>
</section>
</div>
<section class="card" style="margin-top:18px">
<h2>Danh sách Ô</h2>
<div style="overflow:auto"><table><thead><tr><th>Mã Ô</th><th>Khu</th><th>Dãy</th><th>Hàng</th><th>Vị trí</th><th>Trạng thái</th></tr></thead><tbody id="tbody"></tbody></table></div>
</section>
</div>

<div id="modal" class="modal">
<div class="dialog">
<h3 id="modalTitle"></h3>
<div id="modalBody"></div>
<div class="actions"><button class="secondary" onclick="closeModal()">Hủy</button><button class="primary" id="modalSave">Lưu</button></div>
</div>
</div>

<script>
const KEY="ngocnhi_trangtrai_sodo_v2";
const seed={
 area:{id:1,name:"Khu Sinh Sản",code:"KSS",positionX:10,positionY:10,status:"ACTIVE"},
 rows:[
  {id:1,name:"Dãy Cái 1",prefix:"C1",x:20,y:20,w:230,h:105,rowCount:2,status:"ACTIVE"},
  {id:2,name:"Dãy Cái 2",prefix:"C2",x:270,y:20,w:230,h:105,rowCount:2,status:"ACTIVE"},
  {id:3,name:"Dãy Cái 3",prefix:"C3",x:20,y:160,w:230,h:85,rowCount:1,status:"ACTIVE"},
  {id:4,name:"Dãy Đực 1",prefix:"D1",x:270,y:160,w:230,h:105,rowCount:2,status:"ACTIVE"},
  {id:5,name:"Dãy Đực 2",prefix:"D2",x:20,y:300,w:230,h:85,rowCount:1,status:"ACTIVE"},
  {id:6,name:"Dãy Đực 3",prefix:"D3",x:270,y:300,w:230,h:85,rowCount:1,status:"ACTIVE"},
  {id:7,name:"Dãy Đực 4",prefix:"D4",x:520,y:300,w:230,h:105,rowCount:2,status:"ACTIVE"}
 ],
 cages:[
  ["C1-001",1,1,1],["C1-002",1,1,2],["C1-003",1,2,1],
  ["C2-001",2,1,1],["C3-001",3,1,1],
  ["D1-001",4,1,1],["D1-002",4,2,1],
  ["D2-001",5,1,1],["D3-001",6,1,1],["D4-001",7,1,1]
 ].map((x,i)=>({id:i+1,code:x[0],rowId:x[1],rowIndex:x[2],positionIndex:x[3],status:"ACTIVE",history:[{action:"CREATED",time:new Date().toISOString()}]}))
};
let data=load();
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.rows&&x.cages)return x}catch(e){}return clone(seed)}
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById("saveState").textContent="✓ Đã lưu trên trình duyệt"}
function resetDemo(){data=clone(seed);save();render()}
function clearAll(){if(confirm("Xóa toàn bộ dữ liệu sơ đồ đã lưu trên máy?")){localStorage.removeItem(KEY);data=clone(seed);render()}}
function rowById(id){return data.rows.find(r=>r.id===Number(id))}
function render(){
 document.getElementById("areaTitle").textContent=data.area.name;
 const c=document.getElementById("canvas");c.innerHTML="";
 const maxX=Math.max(900,...data.rows.map(r=>r.x+r.w+30)),maxY=Math.max(620,...data.rows.map(r=>r.y+r.h+30));
 c.style.minWidth=maxX+"px";c.style.minHeight=maxY+"px";
 const title=document.createElement("div");title.className="area-label";title.textContent=data.area.name;title.style.position="absolute";title.style.left="15px";title.style.top="8px";c.appendChild(title);
 data.rows.forEach(r=>{
  const box=document.createElement("div");box.className="row-box"+(r.status==="INACTIVE"?" inactive":"");
  box.style.left=r.x+"px";box.style.top=r.y+"px";box.style.width=r.w+"px";box.style.minHeight=r.h+"px";
  box.innerHTML=`<div class="row-title">${esc(r.name)} (${esc(r.prefix)}) · ${r.rowCount} hàng</div><div class="cages"></div>`;
  const grid=box.querySelector(".cages");
  data.cages.filter(x=>x.rowId===r.id).sort((a,b)=>a.rowIndex-b.rowIndex||a.positionIndex-b.positionIndex).forEach(cg=>{
   const e=document.createElement("div");e.className="cage"+(cg.status==="INACTIVE"?" inactive":"");e.textContent=cg.code;e.onclick=()=>selectCage(cg);grid.appendChild(e)
  });
  c.appendChild(box);
 });
 const tbody=document.getElementById("tbody");tbody.innerHTML="";
 data.cages.forEach(cg=>{const r=rowById(cg.rowId);const tr=document.createElement("tr");tr.innerHTML=`<td><b>${esc(cg.code)}</b></td><td>${esc(data.area.name)}</td><td>${esc(r?.name||"")}</td><td>${cg.rowIndex}</td><td>${cg.positionIndex}</td><td><span class="badge ${cg.status.toLowerCase()}">${cg.status}</span></td>`;tbody.appendChild(tr)})
}
function selectCage(cg){
 const r=rowById(cg.rowId);
 document.getElementById("inspector").innerHTML=`<div class="crumb">Trang trại → ${esc(data.area.name)} → ${esc(r.name)} → ${esc(cg.code)}</div>
 <p><b>Mã Ô:</b> ${esc(cg.code)}</p><p><b>Dãy:</b> ${esc(r.name)} (${esc(r.prefix)})</p><p><b>Khu:</b> ${esc(data.area.name)}</p>
 <p><b>Vị trí:</b> Hàng ${cg.rowIndex}, vị trí ${cg.positionIndex}</p>
 <p><b>Trạng thái:</b> <span class="badge ${cg.status.toLowerCase()}">${cg.status}</span></p>
 <p><b>Lịch sử:</b> ${cg.history.length} bản ghi</p>
 <div class="actions" style="justify-content:flex-start"><button class="${cg.status==="ACTIVE"?"danger":"primary"}" onclick="toggleCage(${cg.id})">${cg.status==="ACTIVE"?"Ngừng sử dụng":"Kích hoạt lại"}</button></div>`;
}
function toggleCage(id){let c=data.cages.find(x=>x.id===id);if(!c)return;c.status=c.status==="ACTIVE"?"INACTIVE":"ACTIVE";c.history.push({action:c.status,time:new Date().toISOString()});save();render();selectCage(c)}
function openRowModal(){
 document.getElementById("modalTitle").textContent="Thêm Dãy";
 document.getElementById("modalBody").innerHTML=`<label>Khu</label><select id="fArea"><option value="1">${esc(data.area.name)}</option></select>
 <label>Tên Dãy</label><input id="fName" placeholder="Ví dụ: Dãy Cái 5">
 <label>Prefix</label><input id="fPrefix" placeholder="Ví dụ: C5">
 <label>Số hàng</label><select id="fCount"><option>1</option><option>2</option></select>`;
 document.getElementById("modalSave").onclick=addRow;document.getElementById("modal").classList.add("show")
}
function addRow(){
 const name=document.getElementById("fName").value.trim(),prefix=document.getElementById("fPrefix").value.trim().toUpperCase(),rowCount=Number(document.getElementById("fCount").value);
 if(!name||!prefix)return alert("Nhập đủ tên Dãy và Prefix.");
 if(data.rows.some(r=>r.prefix===prefix))return alert("Prefix đã tồn tại.");
 const n=data.rows.length+1;data.rows.push({id:Math.max(...data.rows.map(r=>r.id),0)+1,name,prefix,x:40+(n%3)*250,y:420+Math.floor(n/3)*140,w:230,h:rowCount===2?105:85,rowCount,status:"ACTIVE"});save();closeModal();render()
}
function openCageModal(){
 document.getElementById("modalTitle").textContent="Thêm Ô";
 document.getElementById("modalBody").innerHTML=`<label>Dãy</label><select id="fRow">${data.rows.filter(r=>r.status==="ACTIVE").map(r=>`<option value="${r.id}">${esc(r.name)} (${esc(r.prefix)})</option>`).join("")}</select>
 <label>Hàng</label><input id="fRowIndex" type="number" min="1" value="1">
 <label>Vị trí trong hàng</label><input id="fPos" type="number" min="1" value="1">`;
 document.getElementById("modalSave").onclick=addCage;document.getElementById("modal").classList.add("show")
}
function addCage(){
 const rowId=Number(document.getElementById("fRow").value),r=rowById(rowId),rowIndex=Number(document.getElementById("fRowIndex").value),pos=Number(document.getElementById("fPos").value);
 if(!r)return;
 if(rowIndex<1||rowIndex>r.rowCount)return alert("Số hàng không hợp lệ.");
 const nums=data.cages.filter(c=>c.rowId===rowId).map(c=>c.seqNumber||Number(c.code.split("-")[1])).filter(Boolean);
 const next=nums.length?Math.max(...nums)+1:1,code=r.prefix+"-"+String(next).padStart(3,"0");
 if(data.cages.some(c=>c.code===code))return alert("Mã Ô bị trùng.");
 const id=Math.max(...data.cages.map(c=>c.id),0)+1;
 data.cages.push({id,code,rowId,rowIndex,positionIndex:pos,status:"ACTIVE",seqNumber:next,history:[{action:"CREATED",time:new Date().toISOString()}]});
 save();closeModal();render()
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();save();
</script>
</body>
</html>
