<script>
"use strict";
/* =========================================================================
   FIREBASE CONFIG — nạp dùng chung từ firebase-config.js (1 nguồn duy nhất
   cho cả 4 trang, xem <script src="firebase-config.js"> trong <head>).
   ========================================================================= */
var FIREBASE_CONFIG = window.FIREBASE_CONFIG || {};

var currentView = "overview";
// Media do Trung tâm điều hành quản lý. Dashboard chỉ đọc realtime, không
// lưu hay sửa media/dữ liệu nghiệp vụ tại đây.
var farmDashboardMedia = { imageUrl:null, videoUrl:null };

/* =========================================================================
   KHỞI TẠO FIREBASE APP (chính) — theo tài liệu chính thức:
   https://firebase.google.com/docs/web/setup
   https://firebase.google.com/docs/database/web/start
   https://firebase.google.com/docs/auth/web/start
   Bọc try/catch: nếu SDK Firebase không tải được (mạng chặn CDN, v.v.),
   ứng dụng vẫn không phát sinh lỗi Console không bắt được — sẽ hiển thị
   thông báo chờ cấu hình thay vì màn hình tr�������ng hoặc lỗi đỏ trong Console.
   ========================================================================= */
var db = null, auth = null, firebaseReady = false;
try{
  if(typeof firebase === "undefined") throw new Error("Firebase SDK chưa tải được (kiểm tra kết nối mạng / chặn CDN).");
  if(!firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
  db = firebase.database();
  auth = firebase.auth();
  firebaseReady = true;
}catch(err){
  console.warn("Firebase chưa sẵn sàng:", err && err.message);
}

/* =========================================================================
   ...
*/

var ZONE_TYPE_LABEL = { breeding:"Sinh sản", juvenile:"Hậu bị", baby:"Baby", commercial:"Thương phẩm", treatment:"Điều trị" };
// Set commercial pad to 3 so codes become C1-001 etc
var ZONE_TYPE_PREFIX = { breeding:{male:"A",female:"B",pad:3}, juvenile:{single:"HB",pad:3}, baby:{single:"BB",pad:3}, commercial:{single:"TP",pad:3}, treatment:{single:"ĐT",pad:2} };
var DEFAULT_ZONES = [
  {code:"K1", name:"Khu 1 - Sinh sản", type:"breeding"},
  {code:"K2", name:"Khu 2 - Sinh sản", type:"breeding"},
  {code:"K3", name:"Khu 3 - Hậu bị",   type:"juvenile"},
  {code:"K4", name:"Khu 4 - Baby",     type:"baby"},
  {code:"K5", name:"Khu 5 - Thương phẩm", type:"commercial"},
  {code:"K6", name:"Khu 6 - Điều trị", type:"treatment"}
];

/* ---- Helpers thuần JS (không liên quan Firebase) ---- */
function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
function addDays(dateStr, n){ var d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function fmtDate(dateStr){ if(!dateStr) return "—"; var p = dateStr.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function pad(n, width){ n=String(n); while(n.length<width) n="0"+n; return n; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function showToast(text, cls){
  var el = document.createElement("div");
  el.className = "toast" + (cls?(" "+cls):"");
  el.textContent = text;
  document.getElementById("toastWrap").appendChild(el);
  setTimeout(function(){ el.remove(); }, 6000);
}

// Extract prefix from cell code. Examples:
//  "Đ1-001" -> "Đ1"
//  "Đ2-012" -> "Đ2"
//  "C1-001" -> "C1"
//  "K1-A-001" -> extract row part "A" (legacy)
function extractRowPrefix(code){
  if(!code) return null;
  code = String(code);
  // Common modern pattern: PREFIX-NNN where PREFIX can be Đ+digit(s) or C+digit(s)
  var m = code.match(/^([\u0110D]\d+|C\d+)\s*-\s*\d+/i);
  if(m) return m[1].toUpperCase();
  // Legacy breeding pattern: Kx-ROW-### e.g. K1-A-001 -> return row label 'A' (preserve uppercase)
  var m2 = code.match(/^[^\-]+-([A-Za-z]+)-\d+/);
  if(m2) return m2[1].toUpperCase();
  // Fallback: take part before first dash
  var parts = code.split('-');
  if(parts.length>1) return parts[0].toUpperCase();
  return code.toUpperCase();
}

// Sanitize row code input when user adds a breeding row. Preserve 'Đ' and digits.
function sanitizeRowCode(name){
  if(!name) return null;
  var s = String(name).trim().toUpperCase();
  // allow letters A-Z, digits 0-9 and Vietnamese Đ (U+0110), remove others, collapse runs to single '-'
  s = s.replace(/[^A-Z0-9\u0110]+/ig, '-');
  s = s.replace(/^-+|-+$/g, '');
  return s || null;
}

/* =========================================================================
   MIGRATION / KHỞI TẠO DỮ LIỆU BAN ĐẦU (versioned)
*/
var CURRENT_SCHEMA_VERSION = 2;
var MIGRATIONS = {
  1: function migrateV1(){
    return FirebaseService.read("Farm/Zones").then(function(zones){
      if(zones) return;
      var updates = {};
      DEFAULT_ZONES.forEach(function(z){
        var zid = FirebaseService.generateKey("Farm/Zones");
        updates["Farm/Zones/"+zid] = { code:z.code, name:z.name, type:z.type };
      });
      return FirebaseService.updateMultiPath(updates);
    });
  },
  2: function migrateV2(){
    return Promise.all([FirebaseService.read("Farm/Zones"), FirebaseService.read("Farm/Cells")]).then(function(res){
      var zones = res[0] || {}; var cells = res[1] || {};
      var cellCountByZone = {};
      Object.keys(cells).forEach(function(cid){ var zid=cells[cid].zoneId; cellCountByZone[zid]=(cellCountByZone[zid]||0)+1; });
      var updates = {};
      Object.keys(zones).forEach(function(zid){
        var zone = zones[zid];
        var spec = DEFAULT_ZONE_CELL_COUNTS[zone.code];
        if(!spec) return;
        if(cellCountByZone[zid]) return;
        if(zone.type === "breeding"){
          var pfx = ZONE_TYPE_PREFIX.breeding;
          // Determine display label: if zone.code indicates Đ1/Đ2, use it; otherwise fallback to Kx mapping
          var labelPrefix = (String(zone.code).toUpperCase().match(/^Đ\d+$/i) ? String(zone.code).toUpperCase() : (zone.code === 'K1' ? 'Đ1' : (zone.code === 'K2' ? 'Đ2' : zone.code)));
          for(var i=1;i<=spec.male;i++){
            var mid = FirebaseService.generateKey("Farm/Cells");
            var mc = buildDefaultCell(zone, {zoneId:zid, sex:"male"});
            mc.code = labelPrefix + "-" + pad(i,pfx.pad);
            updates["Farm/Cells/"+mid] = mc;
          }
          for(var j=1;j<=spec.female;j++){
            var fid = FirebaseService.generateKey("Farm/Cells");
            var fc = buildDefaultCell(zone, {zoneId:zid, sex:"female"});
            fc.code = labelPrefix + "-" + pad(j,pfx.pad);
            updates["Farm/Cells/"+fid] = fc;
          }
        } else if(zone.type === "juvenile"){
          var jpfx = ZONE_TYPE_PREFIX.juvenile;
          for(var k=1;k<=spec.count;k++){
            var jid = FirebaseService.generateKey("Farm/Cells");
            var jc = buildDefaultCell(zone, {zoneId:zid});
            var jLabel = displayZonePrefix ? (displayZonePrefix(zone.code) || (zone.code+"-"+jpfx.single)) : (zone.code+"-"+jpfx.single);
            jc.code = jLabel + pad(k,jpfx.pad);
            updates["Farm/Cells/"+jid] = jc;
          }
        } else if(zone.type === "baby"){
          var bpfx = ZONE_TYPE_PREFIX.baby;
          var n = 1;
          BABY_SEGMENTS.forEach(function(seg){
            for(var s=0;s<spec.perSegment;s++){
              var bid = FirebaseService.generateKey("Farm/Cells");
              var bc = buildDefaultCell(zone, {zoneId:zid, weightSegment:seg});
              var bLabel = displayZonePrefix ? (displayZonePrefix(zone.code) || (zone.code+"-"+bpfx.single)) : (zone.code+"-"+bpfx.single);
              bc.code = bLabel + pad(n,bpfx.pad);
              updates["Farm/Cells/"+bid] = bc;
              n++;
            }
          });
        } else if(zone.type === "commercial"){
          var cpfx = ZONE_TYPE_PREFIX.commercial;
          // Create commercial cells with prefixes C1..C5 (or as many as spec.count)
          for(var c1=1;c1<=spec.count;c1++){
            var cid2 = FirebaseService.generateKey("Farm/Cells");
            var cc = buildDefaultCell(zone, {zoneId:zid});
            var cLabel = 'C'+c1;
            cc.code = cLabel + "-" + pad(1, cpfx.pad);
            updates["Farm/Cells/"+cid2] = cc;
          }
        } else if(zone.type === "treatment"){
          var tpfx = ZONE_TYPE_PREFIX.treatment;
          for(var t1=1;t1<=spec.count;t1++){
            var tid = FirebaseService.generateKey("Farm/Cells");
            var tc = buildDefaultCell(zone, {zoneId:zid});
            var tLabel = displayZonePrefix ? (displayZonePrefix(zone.code) || (zone.code+"-"+tpfx.single)) : (zone.code+"-"+tpfx.single);
            tc.code = tLabel + pad(t1,tpfx.pad);
            updates["Farm/Cells/"+tid] = tc;
          }
        }
      });
      if(Object.keys(updates).length === 0) return;
      return FirebaseService.updateMultiPath(updates);
    });
  }
};

// Helper to show preferred display prefix: Đ1/Đ2 or Cx if code already uses them
function displayZonePrefix(zc){
  if(!zc) return null;
  zc = String(zc).toUpperCase();
  if(/^Đ\d+$/i.test(zc) || /^D\d+$/i.test(zc)) return zc.replace(/^D/, 'Đ');
  if(/^C[1-5]$/i.test(zc)) return zc;
  if(zc==='K1') return 'Đ1';
  if(zc==='K2') return 'Đ2';
  if(zc==='K5') return 'C1';
  return zc;
}

/* =========================================================================
   KHU & Ô — CRUD + SINH MÃ Ô (mục 1)
*/
function nextCellNumber(existingCodes, prefix, padWidth){
  var used = {};
  existingCodes.forEach(function(c){
    if(c.indexOf(prefix) === 0){
      var n = parseInt(c.slice(prefix.length), 10);
      if(!isNaN(n)) used[n] = true;
    }
  });
  var i = 1;
  while(used[i]) i++;
  return prefix + pad(i, padWidth);
}
function buildDefaultCell(zone, opts){
  var base = { zoneId: opts.zoneId, history: {} };
  if(zone.type === "breeding"){
    base.sex = opts.sex; base.state = "vacant"; base.partnerCellId = null; base.pairStartDate = null;
    base.failedMatingCount = 0; base.abandonedCount = 0; base.currentPupCount = 0; base.nextTask = null;
  } else if(zone.type === "juvenile"){
    base.compartments = {
      male:   { occupied:false, state:null, startDate:null, nextTask:null },
      female: { occupied:false, state:null, startDate:null, nextTask:null }
    };
  } else if(zone.type === "baby"){
    base.weightSegment = opts.weightSegment || BABY_SEGMENTS[0]; base.quantity = 0;
  } else if(zone.type === "commercial"){
    base.quantity = 0; base.salesHistory = {};
  } else if(zone.type === "treatment"){
    base.status = "empty"; base.patient = null;
  }
  return base;
}
function breedingRows(zone, cells){
  var rows = zone && zone.breedingRows ? zone.breedingRows : {};
  var seen = {};
  Object.keys(rows).forEach(function(id){ seen[rows[id].code] = true; });
  Object.keys(cells||{}).forEach(function(id){
    var c=cells[id]||{};
    var prefix = extractRowPrefix(c.code);
    if(prefix && !seen[prefix]){
      // infer sex: prefixes starting with A => male, B => female, Đ/D => keep as legacy 'male' (preserve older logic)
      var first = prefix.charAt(0).toUpperCase();
      var sex = (first === 'A' ? 'male' : (first === 'B' ? 'female' : (first === 'Đ' || first === 'D' ? 'male' : null)));
      rows["legacy-"+prefix] = {code:prefix,name:prefix,sex:sex,legacy:true};
      seen[prefix]=true;
    }
  });
  return rows;
}
function addBreedingRow(zoneId, sex, name){
  return FirebaseService.read("Farm/Zones/"+zoneId).then(function(zone){
    if(!zone || zone.type !== "breeding") throw new Error("Chỉ khu sinh sản mới có dãy.");
    var cells = {};
    return FirebaseService.queryEqualTo("Farm/Cells","zoneId",zoneId).then(function(found){
      cells=found||{}; var rows=breedingRows(zone,cells); var code=sanitizeRowCode(name);
      if(!code) throw new Error("Tên dãy không hợp lệ.");
      if(rows[code] || Object.keys(rows).some(function(k){return rows[k].code===code;})) throw new Error("Dãy đã tồn tại.");
      var patch={}; patch["Farm/Zones/"+zoneId+"/breedingRows/"+code]={code:code,name:String(name).trim(),sex:sex,createdAt:Date.now()};
      return FirebaseService.updateMultiPath(patch);
    });
  });
}
function addCell(zoneId, opts){
  opts=opts||{};
  return FirebaseService.read("Farm/Zones/"+zoneId).then(function(zone){
    return FirebaseService.queryEqualTo("Farm/Cells", "zoneId", zoneId).then(function(cells){
      var codes = Object.keys(cells).map(function(k){ return cells[k].code; });
      var prefix, padW;
      if(zone.type === "breeding"){
        var pfx = ZONE_TYPE_PREFIX.breeding;
        var rowCode = opts.rowCode || (opts.sex === "male" ? pfx.male : pfx.female);
        // IMPORTANT: do NOT include zone.code prefix — use row label directly (e.g. Đ1 or A/B)
        prefix = rowCode + "-"; padW = pfx.pad;
      } else {
        var p2 = ZONE_TYPE_PREFIX[zone.type];
        // prefer preserved zone prefix (Đx / Cx) if present; otherwise keep previous pattern
        var zPref = displayZonePrefix(zone.code) || zone.code;
        prefix = zPref + "-"; padW = p2.pad;
      }
      var code = nextCellNumber(codes, prefix, padW);
      var cellId = FirebaseService.generateKey("Farm/Cells");
      var cellData = buildDefaultCell(zone, {zoneId:zoneId, sex:opts.sex, weightSegment:opts.weightSegment});
      cellData.code = code;
      return FirebaseService.write("Farm/Cells/"+cellId, cellData).then(function(){ return {cellId:cellId, code:code}; });
    });
  });
}
