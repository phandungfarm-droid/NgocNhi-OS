<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quán ăn Ngọc Nhi — Hệ thống Dịch vụ Ngọc Nhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="fcm-config.js"></script>
<script src="imgbb-config.js"></script>
<style>
  :root{
    --orange:#F16B03; --orange-dark:#D65E02; --orange-tint:#FFF8F2; --orange-tint2:#FFEFE1;
    --ink:#16172B; --ink-soft:#3A3D52; --gray:#6B7280; --gray-light:#9CA3AF;
    --border:#E7E9F0; --page-bg:#FAFBFD; --card-bg:#FFFFFF;
    --red:#EF4444; --red-tint:#FDECEC; --green:#16A34A; --green-tint:#DCF5E7;
    --blue:#0A65F1; --blue-tint:#EAF1FF;
    --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Be Vietnam Pro',sans-serif;background:var(--page-bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;line-height:1;vertical-align:middle;}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
  label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .app{display:flex;min-height:100vh;max-width:1536px;margin:0 auto;}

  .sidebar{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;}
  .sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px 8px;}
  .sidebar-logo .icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--orange-tint2);border-radius:10px;color:var(--orange);}
  .sidebar-logo .txt{line-height:1.2;} .sidebar-logo .t1{font-weight:800;font-size:14px;} .sidebar-logo .t2{font-weight:500;font-size:10px;color:var(--gray-light);}
  .back-link{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--gray);padding:8px;margin-bottom:8px;}
  .nav-list{display:flex;flex-direction:column;gap:4px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);position:relative;}
  .nav-item .material-symbols-outlined{font-size:19px;color:var(--gray);}
  .nav-item.active{background:var(--orange);color:#fff;} .nav-item.active .material-symbols-outlined{color:#fff;}
  .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px;}
  .sidebar-spacer{flex:1;}
  .auth-box{border:1px solid var(--border);border-radius:12px;padding:12px;font-size:12px;}
  .auth-box .role-badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;margin-bottom:6px;}
  .role-owner{background:var(--orange-tint2);color:var(--orange-dark);}
  .role-staff{background:var(--blue-tint);color:var(--blue);}
  .auth-box button{width:100%;margin-top:8px;padding:8px;border-radius:8px;background:#F3F4F7;font-weight:700;font-size:12px;}

  .main{flex:1;min-width:0;padding:20px 24px 32px;display:flex;flex-direction:column;gap:16px;}
  .topbar{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .topbar h1{font-size:19px;font-weight:800;} .topbar .sub{font-size:12px;color:var(--gray);margin-top:2px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}
  .btn{padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--orange);color:#fff;} .btn-secondary{background:#F3F4F7;color:var(--ink-soft);}
  .btn-danger{background:var(--red-tint);color:#B91C1C;} .btn:disabled{opacity:.5;cursor:not-allowed;}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;}
  .b-empty{background:#F1F2F4;color:#4B5563;} .b-occupied{background:var(--orange-tint2);color:var(--orange-dark);}
  .b-serving{background:var(--blue-tint);color:var(--blue);} .b-completed{background:var(--green-tint);color:#128A4A;}
  .b-cancelled{background:var(--red-tint);color:#B91C1C;} .b-available{background:var(--green-tint);color:#128A4A;}
  .b-unavailable{background:#F1F2F4;color:#6B7280;} .b-new{background:var(--red-tint);color:#B91C1C;}
  .b-confirmed{background:var(--blue-tint);color:var(--blue);} .b-done{background:var(--green-tint);color:#128A4A;}

  .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:18px;}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
  .stat-box{border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .stat-box .v{font-size:20px;font-weight:800;} .stat-box .l{font-size:10.5px;color:var(--gray);font-weight:600;margin-top:2px;}

  .cat-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .cat-tab{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;background:#F3F4F7;color:var(--ink-soft);}
  .cat-tab.active{background:var(--orange);color:#fff;}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .item-card{border:1px solid var(--border);border-radius:10px;padding:12px;}
  .item-card .name{font-weight:800;font-size:13px;} .item-card .price{font-size:12px;color:var(--gray);margin-top:4px;}
  .item-card .row-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .item-card .row-actions button{font-size:11px;padding:6px 8px;border-radius:7px;background:#F3F4F7;color:var(--ink-soft);font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;color:var(--gray);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--border);}
  td{padding:8px;border-bottom:1px solid var(--border);}
  tr:hover td{background:#FAFBFD;}

  .table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .table-card{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;}
  .table-card:hover{border-color:var(--orange);}
  .table-card .name{font-weight:800;font-size:13px;} .table-card .meta{font-size:10.5px;color:var(--gray);margin-top:4px;}

  .order-row{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .order-row .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .order-row .items{font-size:12px;color:var(--ink-soft);} .order-row .items div{padding:2px 0;}
  .order-row .actions{display:flex;gap:8px;margin-top:10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;}
  .modal h3{font-size:16px;font-weight:800;margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
  .hidden{display:none !important;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:340px;}
  .toast{background:#16172B;color:#fff;padding:12px 14px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  .toast.telegram{background:#1F8FE0;} .toast.zalo{background:#0068FF;}

  .fab{position:fixed;bottom:24px;right:24px;background:var(--orange);color:#fff;border-radius:50px;padding:14px 18px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(241,107,3,.4);z-index:40;}
  .fab .fab-badge{background:#fff;color:var(--orange-dark);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;}

  .qty-control{display:flex;align-items:center;gap:8px;}
  .qty-control button{width:26px;height:26px;border-radius:8px;background:#F3F4F7;font-weight:800;}
  .qty-control .n{min-width:20px;text-align:center;font-weight:700;}

  .guest-screen{min-height:100vh;background:var(--orange-tint);padding:16px;padding-bottom:90px;}
  .guest-header{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card);}
  .guest-header h2{font-size:16px;font-weight:800;} .guest-header .sub{font-size:12px;color:var(--gray);margin-top:2px;}
  .guest-cat{margin-bottom:16px;}
  .guest-cat h3{font-size:13px;font-weight:800;color:var(--orange-dark);margin-bottom:8px;}
  .guest-item{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-card);}
  .guest-item .name{font-weight:700;font-size:13px;} .guest-item .price{font-size:11.5px;color:var(--gray);}
  .guest-cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;}
  .sorry-banner{background:var(--red-tint);color:#B91C1C;padding:12px 16px;border-radius:12px;font-size:12.5px;font-weight:600;margin-bottom:14px;}

  @media (max-width:900px){ .app{flex-direction:column;} .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;} .sidebar-spacer{display:none;} }
</style>
</head>
<body>

<div id="guestScreen" class="guest-screen hidden">
  <div class="guest-header">
    <h2 id="guestTableName">Bàn —</h2>
    <div class="sub">Chọn món bạn muốn gọi</div>
  </div>
  <div id="guestSorryBanner" class="sorry-banner hidden">Xin lỗi quý khách, hiện món dúi tạm hết hàng.</div>
  <div id="guestMenu"></div>
  <div class="guest-cart-bar">
    <span id="guestCartCount">0 món</span>
    <button class="btn btn-primary" id="guestSubmitBtn" style="background:#fff;color:var(--ink);">Gửi order</button>
  </div>
</div>
<div id="guestConfirmOverlay" class="modal-overlay hidden">
  <div class="modal" style="text-align:center;">
    <span class="material-symbols-outlined" style="font-size:48px;color:var(--green);">check_circle</span>
    <h3>Đã gửi order!</h3>
    <p style="color:var(--gray);font-size:13px;">Nhà bếp đã nhận được yêu cầu của bạn.</p>
    <div class="modal-actions" style="justify-content:center;"><button class="btn btn-primary" id="guestConfirmCloseBtn">Đóng</button></div>
  </div>
</div>

<div id="mainApp" class="app hidden">
  <aside class="sidebar">
    <a class="back-link" href="index.html"><span class="material-symbols-outlined">arrow_back</span>Về Trang chủ</a>
    <div class="sidebar-logo"><div class="icon"><span class="material-symbols-outlined">restaurant</span></div><div class="txt"><div class="t1">QUÁN ĂN NGỌC NHI</div><div class="t2">Hệ thống dịch vụ Ngọc Nhi</div></div></div>
    <nav class="nav-list">
      <button class="nav-item active" data-view="dashboard"><span class="material-symbols-outlined">dashboard</span>Tổng quan</button>
      <button class="nav-item" data-view="menu"><span class="material-symbols-outlined">restaurant_menu</span>Quản lý món ăn</button>
      <button class="nav-item" data-view="tables"><span class="material-symbols-outlined">table_restaurant</span>Quản lý bàn</button>
      <button class="nav-item" data-view="orders"><span class="material-symbols-outlined">receipt_long</span>Đơn gọi món <span class="nav-badge hidden" id="orderBadge">0</span></button>
      <button class="nav-item" data-view="video"><span class="material-symbols-outlined">play_circle</span>Video giới thiệu</button>
    </nav>
    <div class="sidebar-spacer"></div>
    <div class="auth-box" id="authBox"><span class="role-badge role-owner">Đang kiểm tra</span><div id="authUser">...</div><button id="logoutBtn">Đăng xuất</button></div>
  </aside>

  <main class="main">
    <section class="topbar"><div><h1 id="viewTitle">Tổng quan</h1><div class="sub">Quản lý hoạt động quán ăn</div></div><div class="topbar-actions"><button class="btn btn-secondary" id="refreshBtn"><span class="material-symbols-outlined">refresh</span>Làm mới</button></div></section>
    <div id="viewDashboard"></div>
    <div id="viewMenu" class="hidden"></div>
    <div id="viewTables" class="hidden"></div>
    <div id="viewOrders" class="hidden"></div>
    <div id="viewVideo" class="hidden"></div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay hidden"></div>
<div id="toastWrap" class="toast-wrap"></div>

<script>
'use strict';

let db = null;
let currentUser = null;
let menuItems = {};
let categories = {};
let tables = {};
let orders = {};
let moduleVideo = '';
let currentView = 'dashboard';
let editingItemId = null;

function toast(message, type='') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function formatVND(value) {
  return new Intl.NumberFormat('vi-VN').format(Number(value || 0)) + 'đ';
}

function getImgBBApiKey() {
  const key = window.IMGBB_CONFIG && window.IMGBB_CONFIG.apiKey;
  if (!key || key === 'YOUR_IMGBB_API_KEY') throw new Error('Chưa cấu hình ImgBB API Key.');
  return key;
}

async function uploadToImgBB(file) {
  if (!(file instanceof File)) throw new Error('Tệp ảnh không hợp lệ.');
  if (!file.type.startsWith('image/')) throw new Error('Chỉ được chọn tệp hình ảnh.');
  if (file.size > 32 * 1024 * 1024) throw new Error('Ảnh vượt quá giới hạn 32 MB của ImgBB.');

  const apiKey = getImgBBApiKey();
  const form = new FormData();
  form.append('key', apiKey);
  form.append('image', file);

  const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: form });
  let result = null;
  try { result = await response.json(); } catch (_) {}
  if (!response.ok || !result?.success || !result?.data?.url) {
    throw new Error(result?.error?.message || `ImgBB upload thất bại (HTTP ${response.status}).`);
  }
  return result.data.url;
}

function imageHtml(url, name='Ảnh món ăn') {
  if (!url) return '';
  return `<div style="margin-top:8px;"><img src="${esc(url)}" alt="${esc(name)}" loading="lazy" style="width:100%;max-height:180px;object-fit:cover;border-radius:9px;border:1px solid var(--border);"></div>`;
}

function itemImageUrl(item) { return item?.imageUrl || item?.image || ''; }

async function saveItemImage(itemId, url) {
  if (!db || !itemId) throw new Error('Không xác định được món ăn.');
  await db.ref(`Restaurant/MenuItems/${itemId}/imageUrl`).set(url || '');
  if (menuItems[itemId]) menuItems[itemId].imageUrl = url || '';
}

function openImagePicker(itemId) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,image/webp,image/gif';
  input.addEventListener('change', async () => {
    const file = input.files?.[0];
    if (!file) return;
    const button = document.querySelector(`[data-upload-item="${CSS.escape(itemId)}"]`);
    const oldText = button?.textContent || 'Ảnh';
    if (button) { button.disabled = true; button.textContent = 'Đang tải...'; }
    try {
      const url = await uploadToImgBB(file);
      await saveItemImage(itemId, url);
      toast('Đã tải ảnh món ăn lên ImgBB.');
      renderMenu();
      if (currentView === 'dashboard') renderDashboard();
    } catch (error) {
      console.error(error);
      toast(error.message || 'Không tải được ảnh.', 'telegram');
    } finally {
      if (button) { button.disabled = false; button.textContent = oldText; }
    }
  });
  input.click();
}

async function deleteItemImage(itemId) {
  if (!confirm('Xóa ảnh món ăn này?')) return;
  try {
    await saveItemImage(itemId, '');
    toast('Đã xóa ảnh món ăn.');
    renderMenu();
  } catch (error) {
    console.error(error);
    toast(error.message || 'Không xóa được ảnh.', 'telegram');
  }
}

function renderItemImageActions(item) {
  const id = item.id;
  const url = itemImageUrl(item);
  return `<div class="row-actions">
    <button type="button" data-upload-item="${esc(id)}" onclick="openImagePicker('${esc(id)}')"><span class="material-symbols-outlined" style="font-size:14px;">${url ? 'image' : 'add_photo_alternate'}</span>${url ? 'Đổi ảnh' : 'Thêm ảnh'}</button>
    ${url ? `<button type="button" onclick="deleteItemImage('${esc(id)}')">Xóa ảnh</button>` : ''}
  </div>${imageHtml(url, item.name || 'Ảnh món ăn')}`;
}

function renderMenu() {
  const root = document.getElementById('viewMenu');
  const list = Object.entries(menuItems).map(([id, item]) => ({id, ...item}));
  const cats = Object.entries(categories);
  root.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div><h3 style="font-size:15px;font-weight:800;">Quản lý món ăn</h3><div style="font-size:11px;color:var(--gray);margin-top:2px;">${list.length} món</div></div>
      <button class="btn btn-primary" id="addMenuItemBtn"><span class="material-symbols-outlined">add</span>Thêm món</button>
    </div>
    <div class="cat-tabs" style="margin-bottom:14px;">${cats.map(([id,c]) => `<button class="cat-tab" data-cat="${esc(id)}">${esc(c.name || id)}</button>`).join('')}</div>
    <div class="item-grid" id="menuItemGrid"></div>
  </div>`;
  const grid = root.querySelector('#menuItemGrid');
  const renderCards = (catId='all') => {
    const filtered = catId === 'all' ? list : list.filter(x => x.categoryId === catId);
    grid.innerHTML = filtered.length ? filtered.map(item => `<div class="item-card">
      ${imageHtml(itemImageUrl(item), item.name || 'Ảnh món ăn')}
      <div class="name" style="margin-top:${itemImageUrl(item)?'8px':'0'};">${esc(item.name)}</div>
      <div class="price">${formatVND(item.price)}</div>
      <div style="font-size:10.5px;color:var(--gray);margin-top:4px;">${item.available === false ? 'Tạm hết' : 'Đang bán'}</div>
      ${renderItemImageActions(item)}
      <div class="row-actions"><button type="button" onclick="openMenuModal('${esc(item.id)}')">Sửa món</button><button type="button" onclick="toggleMenuItem('${esc(item.id)}')">${item.available === false ? 'Bật bán' : 'Tắt bán'}</button></div>
    </div>`).join('') : '<div style="font-size:12px;color:var(--gray);">Chưa có món.</div>';
  };
  root.querySelectorAll('.cat-tab').forEach(btn => btn.addEventListener('click', () => { root.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); renderCards(btn.dataset.cat); }));
  const allBtn = document.createElement('button'); allBtn.className='cat-tab active'; allBtn.dataset.cat='all'; allBtn.textContent='Tất cả'; root.querySelector('.cat-tabs').prepend(allBtn); allBtn.addEventListener('click',()=>{root.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('active'));allBtn.classList.add('active');renderCards('all');});
  renderCards();
  root.querySelector('#addMenuItemBtn').addEventListener('click', () => openMenuModal(null));
}

function renderDashboard() {
  const root = document.getElementById('viewDashboard');
  const items = Object.values(menuItems);
  const available = items.filter(x => x.available !== false).length;
  const pendingOrders = Object.values(orders).filter(x => ['new','confirmed','serving'].includes(x.status)).length;
  root.innerHTML = `<div class="grid-stats"><div class="stat-box"><div class="v">${items.length}</div><div class="l">Tổng món</div></div><div class="stat-box"><div class="v">${available}</div><div class="l">Đang bán</div></div><div class="stat-box"><div class="v">${Object.keys(tables).length}</div><div class="l">Bàn</div></div><div class="stat-box"><div class="v">${pendingOrders}</div><div class="l">Order đang xử lý</div></div></div>
  <div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Món đang bán</h3><div class="item-grid">${items.filter(x=>x.available!==false).slice(0,8).map(item=>`<div class="item-card">${imageHtml(itemImageUrl(item),item.name)}<div class="name" style="margin-top:8px;">${esc(item.name)}</div><div class="price">${formatVND(item.price)}</div></div>`).join('') || '<div style="font-size:12px;color:var(--gray);">Chưa có món.</div>'}</div></div>`;
}

function renderTables() { document.getElementById('viewTables').innerHTML = `<div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Quản lý bàn</h3><div class="table-grid">${Object.entries(tables).map(([id,t])=>`<div class="table-card"><div class="name">${esc(t.name || id)}</div><div class="meta">${esc(t.status || 'Trống')}</div></div>`).join('') || '<div style="font-size:12px;color:var(--gray);">Chưa có bàn.</div>'}</div></div>`; }
function renderOrders() { document.getElementById('viewOrders').innerHTML = `<div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Đơn gọi món</h3>${Object.entries(orders).map(([id,o])=>`<div class="order-row"><div class="head"><strong>${esc(o.tableName || o.tableId || id)}</strong><span class="badge b-new">${esc(o.status || 'new')}</span></div><div class="items">${Object.values(o.items||{}).map(x=>`<div>${esc(x.name||'Món')} × ${Number(x.qty||0)}</div>`).join('')}</div></div>`).join('') || '<div style="font-size:12px;color:var(--gray);">Chưa có order.</div>'}</div>`; }
function renderVideo() { document.getElementById('viewVideo').innerHTML = `<div class="card"><h3 style="font-size:15px;font-weight:800;margin-bottom:8px;">Video giới thiệu</h3><div style="font-size:12px;color:var(--gray);">${moduleVideo ? esc(moduleVideo) : 'Chưa cấu hình video giới thiệu.'}</div></div>`; }

function setView(view) {
  currentView=view;
  const map={dashboard:'Tổng quan',menu:'Quản lý món ăn',tables:'Quản lý bàn',orders:'Đơn gọi món',video:'Video giới thiệu'};
  document.getElementById('viewTitle').textContent=map[view]||'Quán ăn';
  ['Dashboard','Menu','Tables','Orders','Video'].forEach(v=>document.getElementById(`view${v}`).classList.add('hidden'));
  const target={dashboard:'viewDashboard',menu:'viewMenu',tables:'viewTables',orders:'viewOrders',video:'viewVideo'}[view];
  document.getElementById(target).classList.remove('hidden');
  document.querySelectorAll('.nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));
  if(view==='dashboard')renderDashboard(); if(view==='menu')renderMenu(); if(view==='tables')renderTables(); if(view==='orders')renderOrders(); if(view==='video')renderVideo();
}

document.querySelectorAll('.nav-item').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));
document.getElementById('refreshBtn').addEventListener('click',loadData);

aasync_placeholder = null;
async function loadData() {
  try {
    if (!window.firebase || !window.firebase.apps?.length) throw new Error('Firebase chưa được cấu hình.');
    db = firebase.database();
    const snap = await db.ref('Restaurant').once('value');
    const data = snap.val() || {};
    menuItems = data.MenuItems || {};
    categories = data.Categories || {};
    tables = data.Tables || {};
    orders = data.Orders || {};
    moduleVideo = data.SystemSettings?.ModuleVideos?.RestaurantVideo || '';
    document.getElementById('mainApp').classList.remove('hidden');
    setView(currentView);
  } catch (error) {
    console.error(error);
    toast(error.message || 'Không tải được dữ liệu.', 'telegram');
  }
}

function boot() {
  if (window.firebase?.auth) {
    firebase.auth().onAuthStateChanged(user => {
      currentUser=user;
      document.getElementById('authUser').textContent=user?.email||'Chưa đăng nhập';
      loadData();
    });
  } else loadData();
}

window.openImagePicker=openImagePicker;
window.deleteItemImage=deleteItemImage;
window.openMenuModal=function(){};
window.toggleMenuItem=function(){};
boot();
</script>
</body>
</html>
